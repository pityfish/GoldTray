name: Build & Release

# 触发条件：
# 1. 推送 v* 版本标签 → 构建并发布 Release
# 2. 手动触发（Actions 页面）→ 仅构建，验证流程可用
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write # tauri-action 需要：创建 Release 并上传安装包
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon（aarch64）
          - platform: windows-latest # Windows x64
          # Intel Mac 包：待 macos-13 (x64) runner 可用时在此添加
    runs-on: ${{ matrix.platform }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 安装 Rust 稳定版
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 编译缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 前端构建检查
        run: pnpm build

      - name: Rust 单元测试
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: 构建并发布
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 版本号自动取自 src-tauri/tauri.conf.json 的 version 字段
          tagName: v__VERSION__
          releaseName: "GoldTray v__VERSION__"
          releaseBody: "请在下方 Assets 下载对应平台的安装包。行情数据为第三方参考价，不构成投资建议。"
          releaseDraft: false
          prerelease: false
